name: Temporary CSS formatting output

on:
  pull_request:
    branches: [main]

jobs:
  format-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed styles and publish formatted content to logs
        run: |
          npx prettier --write public/css/dealer_read_orders.css public/css/dealer_update_orders.css public/css/pages/cart/add-products.css public/css/pages/sales/table.css
          node -e 'const fs=require("fs");for(const f of process.argv.slice(1)){console.log("FORMAT_FILE:"+f);console.log(Buffer.from(fs.readFileSync(f,"utf8")).toString("base64"));}' public/css/dealer_read_orders.css public/css/dealer_update_orders.css public/css/pages/cart/add-products.css public/css/pages/sales/table.css
