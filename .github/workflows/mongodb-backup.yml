name: Respaldo cifrado diario de MongoDB

on:
    schedule:
        # 02:00 en Colombia (UTC-5). El job no modifica la base de producción.
        - cron: '0 7 * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: tienda-mongodb-backup
    cancel-in-progress: false

jobs:
    encrypted-backup:
        name: Crear y conservar respaldo cifrado
        runs-on: ubuntu-22.04
        timeout-minutes: 30
        env:
            MONGO_URI: ${{ secrets.PROD_MONGO_URI }}
            MONGO_DB_NAME: ${{ secrets.PROD_MONGO_DB_NAME }}
            BACKUP_PASSPHRASE: ${{ secrets.PROD_BACKUP_PASSPHRASE }}
            BACKUP_DIR: ${{ runner.temp }}/tienda-galindez-backup
        steps:
            - name: Descargar el código
              uses: actions/checkout@v4
            - name: Configurar Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.23.4
                  cache: npm
            - name: Instalar dependencias de producción
              run: npm ci --omit=dev --no-audit --no-fund
            - name: Crear respaldo cifrado
              run: npm run backup:encrypted
            - name: Conservar respaldo externo cifrado
              uses: actions/upload-artifact@v4
              with:
                  name: tienda-galindez-backup-${{ github.run_id }}
                  if-no-files-found: error
                  retention-days: 35
                  path: ${{ runner.temp }}/tienda-galindez-backup
