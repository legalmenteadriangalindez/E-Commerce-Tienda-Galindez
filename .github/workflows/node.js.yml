name: Pruebas de la tienda
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tienda-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Calidad y formato (Node ${{ matrix.node }})
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Instalar dependencias de desarrollo
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Formato Prettier
        run: npm run format:check
      - name: Pruebas unitarias y de rutas
        run: npm test
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Instalar y comprobar como en Render
        run: npm ci --omit=dev && npm run check
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Preparar MongoDB temporal
        run: |
          curl --fail --location --retry 3 https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2204-8.0.17.tgz -o "$RUNNER_TEMP/mongo.tgz"
          mkdir "$RUNNER_TEMP/mongo"
          tar -xzf "$RUNNER_TEMP/mongo.tgz" --strip-components=1 -C "$RUNNER_TEMP/mongo"
      - run: npm run test:integration
        env:
          MONGOD_BINARY: ${{ runner.temp }}/mongo/bin/mongod
