services:
  - type: web
    name: tienda-galindez
    runtime: node
    buildCommand: npm ci --omit=dev && npm run check
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: WOMPI_ENV
        value: sandbox
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_INTEGRITY_KEY
        sync: false
      - key: WOMPI_EVENTS_KEY
        sync: false
